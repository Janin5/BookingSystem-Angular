<div class="search-container" style="padding: 16px">
  <mat-form-field appearance="outline" style="width: 100%">
    <mat-label>Caută salon sau procedură...</mat-label>
    <input
      matInput
      [formControl]="searchTerm"
      placeholder="Ex: Tuns, Salon..."
    />
    <mat-icon matSuffix>search</mat-icon>
  </mat-form-field>
</div>

<div class="list-container">
  <mat-card *ngFor="let salon of filteredSalons" style="margin-bottom: 16px">
    <mat-card-header>
      <a
        [routerLink]="['/salon', salon.id]"
        style="text-decoration: none; color: inherit"
      >
        <mat-card-title>{{ salon.name }}</mat-card-title>
      </a>
    </mat-card-header>

    <mat-card-content>
      <p>Locație: {{ salon.adress }}</p>
      <p>
        <small>Servicii: {{ getProcedureNames(salon) }}</small>
      </p>
    </mat-card-content>

    <mat-card-actions>
      <button mat-button color="primary">Rezervă acum</button>
    </mat-card-actions>
  </mat-card>

  <div
    *ngIf="filteredSalons.length === 0"
    style="text-align: center; margin-top: 20px"
  >
    <p>Nu am găsit niciun salon pentru căutarea curentă.</p>
  </div>
</div>
