<div class="page">
  <div class="page-header">
    <h1>Saloane</h1>
    <p class="page-subtitle">Alege un salon și descoperă serviciile lui.</p>
  </div>

  <div class="search-container">
    <mat-form-field appearance="outline" class="search-field">
      <mat-label>Caută salon sau procedură...</mat-label>
      <input
        matInput
        [formControl]="searchTerm"
        placeholder="Ex: Tuns, Salon..."
      />
      <mat-icon matSuffix>search</mat-icon>
    </mat-form-field>
  </div>

  <div class="salon-grid">
    <mat-card *ngFor="let salon of filteredSalons" class="salon-card">
      <a [routerLink]="['/salon', salon.id]" class="salon-card-link">
        <mat-card-header>
          <mat-card-title>{{ salon.name }}</mat-card-title>
        </mat-card-header>

        <mat-card-content>
          <p class="salon-address">📍 {{ salon.adress }}</p>
          <p class="salon-services">{{ getProcedureNames(salon) }}</p>
        </mat-card-content>
      </a>

      <mat-card-actions>
        <button mat-button color="primary">Rezervă acum</button>
      </mat-card-actions>
    </mat-card>

    <div class="empty-state" *ngIf="filteredSalons.length === 0">
      <p>Nu am găsit niciun salon pentru căutarea curentă.</p>
    </div>
  </div>
</div>
