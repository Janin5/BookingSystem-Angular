<div class="salon-details-wrapper" *ngIf="salon; else loading">
  <h1 class="salon-title">{{ salon.name }}</h1>
  <hr />

  <mat-tab-group
    mat-stretch-tabs="false"
    mat-align-tabs="start"
    [preserveContent]="true"
  >
    <mat-tab label="Informații">
      <div class="tab-content">
        <p class="info-item">
          <strong>Descriere:</strong> {{ salon.description }}
        </p>
        <p class="info-item">
          <strong>📍 Locație:</strong>
          <a
            [href]="
              'https://www.google.com/maps/search/?api=1&query=' + salon.adress
            "
            target="_blank"
          >
            {{ salon.adress }}
          </a>
        </p>
        <p class="info-item"><strong>📞 Telefon:</strong> {{ salon.phone }}</p>
      </div>
    </mat-tab>

    <mat-tab label="Servicii">
      <ng-template matTabContent>
        <div class="tab-content">
          <app-procedure-list [salonId]="salon!.id"></app-procedure-list>
        </div>
      </ng-template>
    </mat-tab>

    <mat-tab label="Stiliști">
      <ng-template matTabContent>
        <div class="tab-content">
          <!-- TODO: de reconstruit odata cu programul stilistilor -->
        </div>
      </ng-template>
    </mat-tab>
  </mat-tab-group>

  <div class="actions">
    <button mat-raised-button color="primary">
      Rezervă acum la acest salon
    </button>
  </div>

  <a routerLink="/saloane" class="back-link">← Înapoi la listă</a>
</div>

<!-- Acesta este acum in afara div-ului de mai sus -->
<ng-template #loading>
  <div class="loading-state">
    <mat-spinner></mat-spinner>
    <p>Se încarcă detaliile...</p>
  </div>
</ng-template>
